[package]
name = "dlq-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
